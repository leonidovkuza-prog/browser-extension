<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Deep Search</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #212121;
      --text: #f1f1f1;
      --muted: #aaa;
      --accent: #3ea6ff;
      --border: #3f3f3f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 280px;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 "Roboto", "Segoe UI", sans-serif;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
    }

    label {
      display: block;
      margin: 10px 0 4px;
      color: var(--muted);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }

    .row label {
      margin: 0;
      color: var(--text);
    }

    input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 9px 12px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #0f0f0f;
      font-weight: 600;
      cursor: pointer;
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .status {
      min-height: 16px;
      margin-top: 8px;
      color: var(--accent);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Deep Search</h1>

  <div class="row">
    <input id="enabled" type="checkbox" />
    <label for="enabled">Включить Deep Search Mode</label>
  </div>
  <div class="row">
    <input id="hideShorts" type="checkbox" />
    <label for="hideShorts">Скрывать Shorts</label>
  </div>
  <div class="row">
    <input id="hideStreams" type="checkbox" />
    <label for="hideStreams">Скрывать стримы</label>
  </div>

  <label for="minDurationMinutes">Минимальная длительность (мин)</label>
  <input id="minDurationMinutes" type="number" min="1" step="1" />

  <label for="maxViews">Максимум просмотров</label>
  <input id="maxViews" type="number" min="0" step="1000" />

  <button id="save" type="button">Сохранить</button>
  <div class="status" id="status"></div>
  <p class="hint">Работает на странице поиска YouTube. Откройте results и включите режим.</p>

  <script src="popup.js"></script>
</body>
</html>
